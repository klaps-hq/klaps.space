name: Build & Deploy

on:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read
  packages: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      image_tag: ${{ steps.set-env.outputs.image_tag }}
      env_suffix: ${{ steps.set-env.outputs.env_suffix }}
    steps:
      - name: Determine environment
        id: set-env
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "image_tag=latest" >> $GITHUB_OUTPUT
            echo "env_suffix=prod" >> $GITHUB_OUTPUT
          else
            echo "environment=development" >> $GITHUB_OUTPUT
            echo "image_tag=dev" >> $GITHUB_OUTPUT
            echo "env_suffix=dev" >> $GITHUB_OUTPUT
          fi

  build-and-push:
    runs-on: ubuntu-latest
    needs: setup
    environment: ${{ needs.setup.outputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The docker-container driver pushes straight from BuildKit. The
      # default docker driver intermittently fails GHCR pushes of large
      # layers with "unknown blob".
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Layer cache in the GitHub Actions cache, scoped per environment:
      # the deps stage (bun install + the node_modules copy into the
      # builder, ~25 s) is reused while bun.lock is unchanged. The build
      # summary and record upload only feed the Actions UI and cost ~25 s
      # in the post step, so both are off.
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          push: true
          cache-from: type=gha,scope=${{ needs.setup.outputs.env_suffix }}
          cache-to: type=gha,mode=max,scope=${{ needs.setup.outputs.env_suffix }},ignore-error=true
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_TMDB_IMAGE_BASE_URL=${{ vars.NEXT_PUBLIC_TMDB_IMAGE_BASE_URL }}
            API_URL=${{ secrets.API_URL }}
            MAINTENANCE_MODE=${{ secrets.MAINTENANCE_MODE }}
          secrets: |
            internal_api_key=${{ secrets.INTERNAL_API_KEY }}
          tags: |
            ${{ secrets.DOCKER_IMAGE }}:${{ needs.setup.outputs.image_tag }}
            ${{ secrets.DOCKER_IMAGE }}:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: [setup, build-and-push]
    environment: ${{ needs.setup.outputs.environment }}
    env:
      DEPLOY_DIR: ${{ secrets.PROJECT_DIR || secrets.DEPLOY_DIR }}/frontend/${{ needs.setup.outputs.env_suffix }}
      IMAGE_TAG: ${{ needs.setup.outputs.image_tag }}
      ENV_SUFFIX: ${{ needs.setup.outputs.env_suffix }}
      DOMAIN: ${{ secrets.DOMAIN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy docker-compose.yml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: docker-compose.yml
          target: ${{ env.DEPLOY_DIR }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # Fail fast: a failed login/pull must fail the job instead of
            # silently restarting the container from a stale local image.
            set -e

            mkdir -p ${{ env.DEPLOY_DIR }}
            cd ${{ env.DEPLOY_DIR }}

            cat > .env << ENVEOF
            API_URL=${{ secrets.API_URL }}
            INTERNAL_API_KEY=${{ secrets.INTERNAL_API_KEY }}
            GA_MEASUREMENT_ID=${{ secrets.GA_MEASUREMENT_ID }}
            AHREFS_ANALYTICS_KEY=${{ secrets.AHREFS_ANALYTICS_KEY }}
            INDEXNOW_KEY=${{ secrets.INDEXNOW_KEY }}
            DOMAIN=${{ env.DOMAIN }}
            MAINTENANCE_MODE=${{ secrets.MAINTENANCE_MODE }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            PAYLOAD_SECRET=${{ secrets.PAYLOAD_SECRET }}
            S3_ENDPOINT=${{ secrets.S3_ENDPOINT }}
            S3_PUBLIC_URL=${{ secrets.S3_PUBLIC_URL }}
            S3_BUCKET=${{ secrets.S3_BUCKET }}
            S3_ACCESS_KEY_ID=${{ secrets.S3_ACCESS_KEY_ID }}
            S3_SECRET_ACCESS_KEY=${{ secrets.S3_SECRET_ACCESS_KEY }}
            S3_REGION=${{ secrets.S3_REGION }}
            ENVEOF

            # GHCR_USER must be the account that owns GHCR_PAT.
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ secrets.GHCR_USER || github.actor }} --password-stdin

            export DOCKER_IMAGE=${{ secrets.DOCKER_IMAGE }}
            export DOMAIN=${{ env.DOMAIN }}
            export ENV_SUFFIX=${{ env.ENV_SUFFIX }}
            export IMAGE_TAG=${{ env.IMAGE_TAG }}

            # compose pull guarantees we pull exactly the image compose
            # is about to run (single source of truth for the image name).
            docker compose -p klaps-frontend-${{ env.ENV_SUFFIX }} pull
            docker compose -p klaps-frontend-${{ env.ENV_SUFFIX }} up -d --force-recreate

            docker image prune -f || true

      # `next build` runs without the API and the CMS, so ISR pages and
      # sub-sitemaps fed by them (blog, feed, landing pages, sitemaps) ship
      # empty and only refill on a request after their revalidate window.
      # Rarely visited ones stayed empty for hours after a release (October
      # 2026: /sitemap/blog.xml and /sitemap/tematy.xml). The prerendered
      # copies count as fresh for the first revalidate window (300 s), so
      # requests before that only get the empty copy back. The app's
      # revalidate-after-deploy route drops those copies on demand as soon as
      # the container answers; the blog sitemap poll stays as a fallback for
      # when that call fails. Then two passes: the first marks every page
      # stale and triggers the regeneration, the second picks the fresh copy
      # up. Best effort: never fails the deploy.
      - name: Warm ISR caches
        continue-on-error: true
        env:
          SITE: https://${{ env.DOMAIN }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
        run: |
          for i in $(seq 1 36); do
            curl -fsS -o /dev/null "$SITE/" && break
            sleep 5
          done
          curl -fsS -X POST -H "x-internal-api-key: $INTERNAL_API_KEY" \
            "$SITE/api/revalidate-after-deploy" || echo "on-demand revalidation failed"
          for i in $(seq 1 30); do
            urls=$(curl -s "$SITE/sitemap/blog.xml" | grep -c '<loc>' || true)
            echo "poll $i: blog sitemap URLs: $urls"
            [ "${urls:-0}" -gt 0 ] && break
            sleep 20
          done
          paths="/ /seanse /kina /miasta /gatunki /rezyserzy /blog /blog/feed.xml /kino-plenerowe /klasyka-w-kinach /w-liczbach /sitemap.xml /sitemap/static.xml /sitemap/filmy.xml /sitemap/kina.xml /sitemap/miasta.xml /sitemap/gatunki.xml /sitemap/rezyserzy.xml /sitemap/blog.xml /sitemap/tematy.xml /llms.txt"
          for pass in 1 2; do
            for path in $paths; do
              code=$(curl -s -o /dev/null -w "%{http_code}" "$SITE$path" || true)
              echo "pass $pass $code $path"
            done
            sleep 20
          done
          echo "blog sitemap URLs: $(curl -s "$SITE/sitemap/blog.xml" | grep -c '<loc>' || true)"
